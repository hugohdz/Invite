<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galería de Invitaciones</title>
  <meta name="description" content="Descubre nuestra galería de invitaciones únicas y especiales para tu evento">
  <meta property="og:title" content="Galería de Invitaciones">
  <meta property="og:description" content="Descubre nuestra galería de invitaciones únicas y especiales para tu evento.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/galeria.css">
</head>
<body>
  <main class="visor">
    <!-- Estado: cargando / vacío / iframe -->
    <div id="cargando" class="estado">
      <span class="spinner" aria-hidden="true"></span>
      <span>Cargando catálogo...</span>
    </div>
    <div id="vacio" class="estado" hidden>
      <p class="estado-titulo">Sin invitaciones en el catálogo</p>
      <p>Agrega invitaciones en <code>data/catalogo.js</code></p>
    </div>
    <iframe id="visor-frame" title="" hidden></iframe>
  </main>

  <!-- Botón "Enviar Favoritas" (solo con ?whatsapp= y al menos una favorita) -->
  <div id="enviar-wrap" class="enviar-wrap" hidden>
    <button id="btn-enviar" type="button" class="btn-enviar">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span id="btn-enviar-texto">Enviar Favoritas (0)</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- Barra flotante inferior -->
  <nav class="barra" aria-label="Navegación de la galería">
    <button id="btn-anterior" type="button" class="barra-btn" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>

    <button id="btn-titulo" type="button" class="barra-titulo" aria-label="Ver todas las invitaciones">
      <span id="titulo-actual"></span>
    </button>

    <div id="fav-wrap" class="fav-wrap" hidden>
      <div id="hint-corazon" class="hint" hidden>¡Marca tus favoritas! 🤍<span class="hint-flecha"></span></div>
      <span id="hint-pulso" class="pulso" hidden></span>
      <button id="btn-favorita" type="button" class="barra-btn btn-fav" aria-label="Agregar a favoritas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      </button>
    </div>

    <button id="btn-siguiente" type="button" class="barra-btn" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>

  <!-- Menú: lista de invitaciones -->
  <div id="menu" class="modal" hidden>
    <div class="modal-fondo" data-cerrar></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-titulo">
      <header class="panel-head">
        <h2 id="menu-titulo">Invitaciones</h2>
        <button type="button" class="cerrar" aria-label="Cerrar" data-cerrar>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </header>
      <ul id="menu-lista" class="panel-lista"></ul>
    </section>
  </div>

  <!-- Carrito: favoritas + envío por WhatsApp -->
  <div id="carrito" class="modal" hidden>
    <div class="modal-fondo" data-cerrar></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="carrito-titulo">
      <header class="panel-head">
        <h2 id="carrito-titulo">Tus favoritas</h2>
        <button type="button" class="cerrar" aria-label="Cerrar" data-cerrar>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </header>
      <ul id="carrito-lista" class="panel-lista"></ul>
      <footer class="panel-pie">
        <a id="btn-whatsapp" class="btn-whatsapp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.5h-.01a9.4 9.4 0 01-4.8-1.31l-.34-.2-3.57.93.95-3.48-.22-.36a9.4 9.4 0 01-1.44-5.02c0-5.2 4.23-9.43 9.44-9.43 2.52 0 4.89.98 6.67 2.77a9.37 9.37 0 012.76 6.67c0 5.2-4.23 9.43-9.44 9.43m8.03-17.46A11.3 11.3 0 0012.05.7C5.8.7.7 5.8.7 12.06c0 2 .52 3.95 1.52 5.67L.6 23.6l6.02-1.58a11.3 11.3 0 005.42 1.38h.01c6.26 0 11.35-5.1 11.36-11.36 0-3.03-1.18-5.89-3.33-8.03"/></svg>
          Enviar por WhatsApp
        </a>
      </footer>
    </section>
  </div>

  <script src="data/catalogo.js"></script>
  <script src="js/galeria.js"></script>
</body>
</html>
